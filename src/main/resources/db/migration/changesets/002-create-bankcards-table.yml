databaseChangeLog:
  - changeSet:
      id: 2
      author: Pavel
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: bank_cards
      changes:
        - createTable:
            tableName: bank_cards
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: card_number
                  type: VARCHAR
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_bank_cards_card_number
              - column:
                  name: expiry_date
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: balance
                  type: DECIMAL(19, 2)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_bank_cards_to_users
                    referencedTableName: users
                    referencedColumnNames: id