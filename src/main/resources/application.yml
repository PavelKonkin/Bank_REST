#
# application.yml — главный конфигурационный файл Spring Boot.

#Что нужно сделать:
#  - Указать настройки подключения к базе данных.
#  - Указать порт приложения.
#  - Настроить параметры безопасности и JWT.
#  - Включить Swagger UI.
server:
  port: 8080

spring:
  jpa:
    hibernate.ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        show_sql: true
        generate-ddl: false
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://${BANKCARDS_DB_CONTAINER_NAME:localhost}:6542/${POSTGRE_BANKCARDS_DB_NAME:bankcards}
    username: ${POSTGRE_BANKCARDS_USER:bankcards}
    password: ${POSTGRE_BANKCARDS_PASS:bankcards}
  liquibase:
    change-log: classpath:/db/migration/db.changelog-master.yml
    enabled: true
    default-schema: public
    liquibase-schema: public
springdoc:
  api-docs:
    enabled: true
jwt:
  service:
    secret: ${JWT_SECRET:placeholder}
    expiration: 86400000
encryption:
  secret:
    key: ${ENCRYPTION_SECRET_KEY:placeholder}
  hash-pepper: ${ENCRYPTION_HASH_PEPPER:placeholder}
# ===============================
# CORS Configuration
# ===============================
# URL фронтенд-приложения, которому разрешено делать запросы.
# Значение берется из переменной окружения FRONTEND_URL.
# Если переменная не задана, используется http://localhost:3000 для локальной разработки.
app:
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:3000,http://localhost:4200,http://localhost:5173}