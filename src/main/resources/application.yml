#
# application.yml — главный конфигурационный файл Spring Boot.

#Что нужно сделать:
#  - Указать настройки подключения к базе данных.
#  - Указать порт приложения.
#  - Настроить параметры безопасности и JWT.
#  - Включить Swagger UI.
server:
  port: 8080

spring:
  jpa:
    hibernate.ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        show_sql: true
        generate-ddl: false
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://${BANKCARDS_DB_CONTAINER_NAME:localhost}:6542/${POSTGRE_BANKCARDS_DB_NAME:bankcards}
    username: ${POSTGRE_BANKCARDS_USER:bankcards}
    password: ${POSTGRE_BANKCARDS_PASS:bankcards}
  liquibase:
    change-log: classpath:/db/migration/db.changelog-master.yml
    enabled: true
    default-schema: public
    liquibase-schema: public
springdoc:
  api-docs:
    enabled: true
    path: "docs/openapi.yaml"
jwt:
  service:
    secret: ${JWT_SERVICE_SECRET:placeholder}